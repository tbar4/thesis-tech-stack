####################################################################
# Machine-readable twin of src/appendices/e-reading-map.md.
#
# The appendix is the source of truth for *prose* — why a book earns
# its place, what to skip, how the waves relate. This file is the
# source of truth for the *joins*: short key -> Zotero item, chapter
# -> read-along pointer. Consumers (thesis-app) read this, never the
# markdown.
#
# When this file and the appendix disagree, the appendix wins for
# prose and this file wins for keys and locators. When a chapter's
# own `read-along` admonition disagrees with either, the chapter wins
# and both get corrected — that is the rule the appendix declares
# over its own tables.
#
# Zotero keys are items in the personal library (user 16196433).
# Every book with `in_zotero = true` also carries the `pan-build` tag
# there; see ~/claude/zotero-tagger/VOCABULARY.md. `pan-build` is an
# index, not a priority — reading priority lives only in the fire
# tiers, so `sync_reading_todos` keeps one source of truth.
####################################################################

[meta]
appendix = "src/appendices/e-reading-map.md"
zotero_tag = "pan-build"
zotero_library = "users/16196433"
# References dir holds local copies, gitignored; see references/README.md.
references_dir = "../references"


