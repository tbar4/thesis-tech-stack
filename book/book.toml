[book]
title = "Evals as Rewards"
authors = ["Trevor Barnes"]
language = "en"
description = "Measuring and training reasoning models on one GPU."
src = "src"

[build]
create-missing = false

[preprocessor.katex]

[preprocessor.admonish]
command = "mdbook-admonish"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[output.html]
mathjax-support = false
# Served from GitHub project Pages at https://tbar4.github.io/thesis-tech-stack/,
# so assets and the generated 404 page must resolve under that subpath.
site-url = "/thesis-tech-stack/"
# mdbook-admonish and mdbook-mermaid assets are installed with:
#   mdbook-admonish install book
#   mdbook-mermaid install book
# CI runs both before building; see .github/workflows/book.yml.
additional-css = ["theme/mdbook-admonish.css", "theme/code-filenames.css"]
# theme/code-filenames.js renders each code fence's `title="path"` as a filename
# caption. The mermaid assets are listed explicitly (in the order mdbook-mermaid
# install produces) so that `mdbook-mermaid install` stays a no-op on this file.
additional-js = ["theme/code-filenames.js", "mermaid.min.js", "mermaid-init.js"]
git-repository-url = "https://github.com/tbar4/thesis-tech-stack"

[output.linkcheck]
optional = true
follow-web-links = false
