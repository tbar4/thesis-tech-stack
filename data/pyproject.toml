[project]
name = "sda-data"
version = "0.1.0"
description = "SDA data platform: ingest, freeze, serve (thesis-tech-stack data/ sub-project)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandera>=0.20",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "deltalake>=0.19",
    "dlt[filesystem,parquet]>=1.0",
    "spacetrack>=1.3",
    "dbt-duckdb>=1.8",
    "sgp4>=2.23",
    "numpy>=1.26",
    "lancedb>=0.13",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sda_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
