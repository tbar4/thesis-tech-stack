[project]
name = "sda-data"
version = "0.1.0"
description = "SDA data platform: ingest, freeze, serve (thesis-tech-stack data/ sub-project)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandera>=0.20",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "deltalake>=0.19",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sda_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
