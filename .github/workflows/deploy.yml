name: book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate per ref so PR validation builds never queue behind (or cancel) the
  # live main deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_ADMONISH_VERSION: "1.18.0"
  MDBOOK_KATEX_VERSION: "0.9.2"
  MDBOOK_MERMAID_VERSION: "0.14.0"
  MDBOOK_TOC_VERSION: "0.14.2"
  MDBOOK_LINKCHECK_VERSION: "0.7.7"

jobs:
  # Runs on every push and pull_request: compiles the toolchain and builds the
  # book with linkcheck enabled. This is the pre-merge gate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install mdbook and preprocessors
        run: |
          set -euo pipefail
          cargo install mdbook --version "${MDBOOK_VERSION}" --locked
          cargo install mdbook-admonish --version "${MDBOOK_ADMONISH_VERSION}" --locked
          cargo install mdbook-katex --version "${MDBOOK_KATEX_VERSION}" --locked
          cargo install mdbook-mermaid --version "${MDBOOK_MERMAID_VERSION}" --locked
          cargo install mdbook-toc --version "${MDBOOK_TOC_VERSION}" --locked
          cargo install mdbook-linkcheck --version "${MDBOOK_LINKCHECK_VERSION}" --locked

      - name: Install admonish and mermaid assets
        working-directory: book
        run: |
          set -euo pipefail
          mdbook-admonish install .
          mdbook-mermaid install .

      - name: Build the book (linkcheck enabled)
        working-directory: book
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # mdbook renders HTML here (the html + linkcheck renderers put the
          # site under book/book/html). Pages needs the dir that holds
          # index.html, NOT the whole book/ source tree.
          path: book/book/html

  # Deploys only on pushes to main (and manual dispatch); never on pull_request.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
